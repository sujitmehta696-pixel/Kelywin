services:
  - type: web
    name: kelywin-famgateway-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: FIRESTORE_DATABASE_ID
        value: ai-studio-android-kelywing-6aebd6f3-784d-4585-8d00-7a7b234bfbcf
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FAMGATEWAY_API_KEY
        sync: false
